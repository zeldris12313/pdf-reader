<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>番號轉 PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .card { background: #1e1e1e; padding: 1.8rem; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
        h2 { margin: 0; font-size: 1.3rem; }
        .gear-btn { background: #2c2c2c; border: none; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
        input { width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 10px; border: 1px solid #333; background: #2c2c2c; color: #fff; box-sizing: border-box; margin-bottom: 1rem; }
        input[type="number"] { font-size: 1.3rem; text-align: center; letter-spacing: 2px; }
        button.primary { width: 100%; padding: 14px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; border: none; background: #ed2553; color: white; cursor: pointer; }
        button.primary:disabled { background: #555; }
        #status { margin-top: 1rem; font-size: 0.9rem; color: #aaa; text-align: center; min-height: 1.4rem; line-height: 1.5; word-break: break-word; white-space: pre-line; }
        #result-box { display: none; margin-top: 1.2rem; padding: 1rem; background: #262626; border-radius: 12px; border: 1px solid #383838; }
        .book-title { font-size: 0.95rem; font-weight: bold; color: #fff; margin-bottom: 0.9rem; line-height: 1.4; word-break: break-word; }
        .dl-btn { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 10px; border: none; color: #fff; cursor: pointer; margin-bottom: 0.6rem; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .dl-pdf { background: #2ea043; }
        .dl-png { background: #1f6feb; margin-bottom: 0; }
        #settings-panel { display: none; margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid #333; }
        label { display: block; font-size: 0.85rem; color: #bbb; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>番號轉 PDF 工具</h2>
            <button class="gear-btn" onclick="toggleSettings()">⚙️ 設定中轉站</button>
        </div>

        <input type="number" id="code" placeholder="輸入番號 (例如 697515)" inputmode="numeric">
        <button class="primary" id="btn" onclick="startProcess()">開始讀取並製作檔案</button>
        <div id="status">請先按右上角「⚙️ 設定」填入中轉站網址</div>

        <div id="result-box">
            <div class="book-title" id="display-title"></div>
            <button class="dl-btn dl-pdf" onclick="saveFile('pdf')">📄 儲存／下載 PDF</button>
            <button class="dl-btn dl-png" onclick="saveFile('png')">🖼️ 儲存／下載封面 PNG</button>
        </div>

        <div id="settings-panel">
            <label>Cloudflare Worker 中轉站網址</label>
            <input type="url" id="worker-url" placeholder="https://tight-brook-0a4c.zeldris12313.workers.dev">
            <button class="primary" style="background:#2ea043;" onclick="saveSettings()">儲存網址</button>
        </div>
    </div>

    <script>
        const EXT_MAP = { j: 'jpg', p: 'png', g: 'gif', w: 'webp' };
        const IMG_SERVERS = ['https://i.nhentai.net', 'https://i2.nhentai.net', 'https://i3.nhentai.net'];
        let readyFiles = { pdf: null, png: null };

        window.onload = () => {
            const saved = localStorage.getItem('worker_url');
            if (saved) {
                document.getElementById('worker-url').value = saved;
                document.getElementById('status').innerText = '準備就緒，請輸入番號';
            }
        };

        function toggleSettings() {
            const p = document.getElementById('settings-panel');
            p.style.display = (p.style.display === 'none' || !p.style.display) ? 'block' : 'none';
        }

        function saveSettings() {
            let url = document.getElementById('worker-url').value.trim();
            if (url && !url.startsWith('http')) url = 'https://' + url;
            if (url.endsWith('/')) url = url.slice(0, -1);
            localStorage.setItem('worker_url', url);
            document.getElementById('worker-url').value = url;
            alert('✅ 已儲存！');
            document.getElementById('settings-panel').style.display = 'none';
            document.getElementById('status').innerText = '準備就緒，請輸入番號';
        }

        function sanitizeFilename(name) {
            return name
                .replace(/[\/\\?%*:|"<>]/g, '_')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 120);
        }

        // 多路線抓取：優先用你的 Cloudflare Worker，遇 429 或阻擋時自動切換後備通道
        async function smartFetch(targetUrl, workerUrl) {
            const encoded = encodeURIComponent(targetUrl);
            const routes = [
                `${workerUrl}?url=${encoded}`,
                `https://api.codetabs.com/v1/proxy?quest=${encoded}`,
                `https://corsproxy.io/?${encoded}`
            ];

            let lastRes = null;
            for (const route of routes) {
                try {
                    const res = await fetch(route);
                    if (res.ok) return res;
                    lastRes = res;
                } catch (_) {}
            }
            if (lastRes) return lastRes;
            throw new Error('所有連線通道均無法存取目標網址');
        }

        // 從網頁 HTML 解析出書名與所有原圖網址（繞過 API 限流）
        function parseGalleryFromHtml(html, code) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const h1 = doc.querySelector('h1.title');
            const title = h1 ? h1.textContent.trim() : code;

            // 嘗試讀取網頁內嵌 JSON
            const jsonMatch = html.match(/window\._gallery\s*=\s*JSON\.parse\("(.+?)"\);/);
            if (jsonMatch) {
                try {
                    const unescaped = JSON.parse(`"${jsonMatch[1]}"`);
                    const data = JSON.parse(unescaped);
                    const pages = data.images && data.images.pages ? data.images.pages : [];
                    if (pages.length > 0) {
                        const realTitle = (data.title && (data.title.japanese || data.title.english)) || title;
                        const urls = pages.map((p, idx) => {
                            const ext = EXT_MAP[p.t] || 'jpg';
                            const server = IMG_SERVERS[idx % IMG_SERVERS.length];
                            return `${server}/galleries/${data.media_id}/${idx + 1}.${ext}`;
                        });
                        return { title: realTitle, urls };
                    }
                } catch (_) {}
            }

            // 後備：直接從縮圖標籤還原所有原圖網址
            const thumbs = doc.querySelectorAll('.thumb-container img');
            const urls = [];
            thumbs.forEach((img, idx) => {
                const src = img.getAttribute('data-src') || img.getAttribute('src') || '';
                const m = src.match(/\/galleries\/(\d+)\/(\d+)t\.(jpg|png|gif|webp)/i);
                if (m) {
                    const server = IMG_SERVERS[idx % IMG_SERVERS.length];
                    urls.push(`${server}/galleries/${m[1]}/${m[2]}.${m[3]}`);
                }
            });

            if (urls.length === 0) throw new Error('無法從頁面解析出圖片列表');
            return { title, urls };
        }

        function processImageBlob(blob, isCover) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);

                    const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.92);
                    const baseResult = {
                        dataUrl: jpegDataUrl,
                        width: img.naturalWidth,
                        height: img.naturalHeight,
                        coverPngBlob: null
                    };

                    if (isCover) {
                        canvas.toBlob((pngBlob) => {
                            baseResult.coverPngBlob = pngBlob;
                            resolve(baseResult);
                        }, 'image/png');
                    } else {
                        resolve(baseResult);
                    }
                };
                img.onerror = () => reject(new Error('圖片解碼失敗'));
                img.src = url;
            });
        }

        async function saveFile(type) {
            const item = readyFiles[type];
            if (!item) return;

            const file = new File([item.blob], item.filename, { type: item.mime });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file] });
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }

            const url = URL.createObjectURL(item.blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = item.filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        async function startProcess() {
            const workerUrl = localStorage.getItem('worker_url');
            const code = document.getElementById('code').value.trim();
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const resultBox = document.getElementById('result-box');

            if (!workerUrl) {
                toggleSettings();
                return alert('請先填入 Cloudflare 中轉站網址！');
            }
            if (!code) return alert('請輸入番號');

            btn.disabled = true;
            resultBox.style.display = 'none';
            readyFiles = { pdf: null, png: null };
            status.innerText = '1/3 正在讀取作品頁面與書名...';

            try {
                // 直接讀取主頁面 HTML，避開 /api/v2/ 嚴格限流
                const pageRes = await smartFetch(`https://nhentai.net/g/${code}/`, workerUrl);
                if (!pageRes.ok) {
                    throw new Error(`讀取資料失敗 (狀態碼 ${pageRes.status})`);
                }

                const html = await pageRes.text();
                const { title, urls } = parseGalleryFromHtml(html, code);
                const total = urls.length;
                const safeTitle = sanitizeFilename(title) || code;

                const { jsPDF } = window.jspdf;
                let pdf = null;
                let coverPngBlob = null;

                for (let i = 0; i < total; i++) {
                    const pageNum = i + 1;
                    status.innerText = `2/3 正在下載原圖 (${pageNum} / ${total} 頁)...`;

                    const imgRes = await smartFetch(urls[i], workerUrl);
                    if (!imgRes.ok) throw new Error(`第 ${pageNum} 頁下載失敗 (狀態碼 ${imgRes.status})`);

                    const blob = await imgRes.blob();
                    const isCover = (i === 0);
                    const imgInfo = await processImageBlob(blob, isCover);

                    if (isCover) {
                        coverPngBlob = imgInfo.coverPngBlob;
                    }

                    const orientation = imgInfo.width > imgInfo.height ? 'l' : 'p';
                    if (i === 0) {
                        pdf = new jsPDF({ orientation, unit: 'px', format: [imgInfo.width, imgInfo.height] });
                    } else {
                        pdf.addPage([imgInfo.width, imgInfo.height], orientation);
                    }
                    pdf.addImage(imgInfo.dataUrl, 'JPEG', 0, 0, imgInfo.width, imgInfo.height);
                }

                status.innerText = '3/3 正在打包檔案...';
                const pdfBlob = pdf.output('blob');

                readyFiles.pdf = {
                    blob: pdfBlob,
                    filename: `${safeTitle}.pdf`,
                    mime: 'application/pdf'
                };
                if (coverPngBlob) {
                    readyFiles.png = {
                        blob: coverPngBlob,
                        filename: `${safeTitle}_封面.png`,
                        mime: 'image/png'
                    };
                }

                document.getElementById('display-title').innerText = `📚 ${safeTitle}（共 ${total} 頁）`;
                resultBox.style.display = 'block';
                status.innerText = '✅ 製作完成！請按下方按鈕儲存：';
            } catch (err) {
                status.innerText = `❌ 錯誤：${err.message}`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
